name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure & Build Windows x64
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          $stage = "stage_win/WhackedRecomp"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/WhackedRecomp.exe $stage/
          Copy-Item recomplauncher.json, README.md, LICENSE $stage/
          Copy-Item -Recurse assets "$stage/assets"
          New-Item -ItemType Directory -Force -Path "$stage/third_party/rl_achievements" | Out-Null
          Copy-Item third_party/rl_achievements/LICENSE "$stage/third_party/rl_achievements/"
          Compress-Archive -Path "$stage/*" -DestinationPath "WhackedRecomp-$tag-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: WhackedRecomp-*-Windows-x64.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev libgl-dev file desktop-file-utils
      - name: Configure & Build Linux x64 (glibc 2.35 compatible)
        run: |
          cmake -B build_linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build_linux -j"$(nproc)"
          ctest --test-dir build_linux --output-on-failure
      - name: Package Portable Linux Folder as AppImage & Tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ inputs.tag }}"; fi

          mkdir -p AppDir/usr/bin AppDir/assets AppDir/third_party/rl_achievements AppDir/usr/share/icons/hicolor/512x512/apps AppDir/usr/share/icons/hicolor/scalable/apps
          cp build_linux/WhackedRecomp AppDir/usr/bin/WhackedRecomp
          cp recomplauncher.json README.md LICENSE AppDir/
          cp -r assets/* AppDir/assets/
          cp third_party/rl_achievements/LICENSE AppDir/third_party/rl_achievements/

          cat > AppDir/WhackedRecomp.desktop << 'EOF'
          [Desktop Entry]
          Name=WhackedRecomp
          Exec=WhackedRecomp
          Icon=whackedrecomp
          Type=Application
          Categories=Game;
          EOF

          cp assets/icon.png AppDir/usr/share/icons/hicolor/512x512/apps/whackedrecomp.png
          cp assets/icon.png AppDir/whackedrecomp.png
          cp assets/icon.png AppDir/.DirIcon
          cat > AppDir/usr/share/icons/hicolor/scalable/apps/whackedrecomp.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
            <rect width="128" height="128" rx="22" fill="#0d1117"/>
            <rect x="6" y="6" width="116" height="116" rx="18" fill="none" stroke="#1db954" stroke-width="6"/>
            <text x="64" y="82" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="68" fill="#f5a623">W!</text>
          </svg>
          EOF

          curl -sSL -o linuxdeploy.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -sSL -o appimagetool.AppImage "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x linuxdeploy.AppImage appimagetool.AppImage
          ARCH=x86_64 ./linuxdeploy.AppImage --appdir AppDir --appimage-extract-and-run || true

          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/usr/lib:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/bin/WhackedRecomp" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Pack the identical portable folder as both tarball and type-2 AppImage
          tar -C AppDir -czf "WhackedRecomp-${TAG}-Linux-x64.tar.gz" .
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir "WhackedRecomp-${TAG}-Linux-x64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            WhackedRecomp-*-Linux-x64.tar.gz
            WhackedRecomp-*-Linux-x64.AppImage

  publish-release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: sha256sum WhackedRecomp-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            WhackedRecomp-*
            SHA256SUMS.txt
